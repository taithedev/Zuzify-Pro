name: Build ZuzifyPro Windows

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    name: Windows desktop app (.exe + NSIS installer)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Check frontend JavaScript
        run: node --check web/app.js
      - name: Install Tauri CLI
        run: cargo install tauri-cli --version '^2' --locked
      - name: Build native Windows app
        working-directory: src-tauri
        run: cargo tauri build
      - name: Upload portable EXE
        uses: actions/upload-artifact@v4
        with:
          name: ZuzifyPro-Portable-Windows-x64
          path: src-tauri/target/release/zuzifypro.exe
          if-no-files-found: error
      - name: Upload Windows NSIS installer
        uses: actions/upload-artifact@v4
        with:
          name: ZuzifyPro-Installer-Windows-x64
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
