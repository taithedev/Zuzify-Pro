name: Build WidSetV2 Windows
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    name: Build and test native app
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Verify frontend syntax
        run: node --check web/app.js
      - name: Compile Rust backend
        working-directory: src-tauri
        run: cargo check
      - name: Install Tauri CLI
        run: cargo install tauri-cli --version '^2' --locked
      - name: Build native Windows executable and installer
        working-directory: src-tauri
        run: cargo tauri build
      - name: Upload portable EXE
        uses: actions/upload-artifact@v4
        with:
          name: WidSetV2-Portable-x64
          path: src-tauri/target/release/widsetv2.exe
          if-no-files-found: error
      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: WidSetV2-Setup-x64
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
