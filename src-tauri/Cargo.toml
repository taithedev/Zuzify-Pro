[package]
name = "widsetv2"
version = "2.0.0"
description = "WidSetV2 — native Windows settings control center"
authors = ["Zuzify"]
edition = "2021"

[lib]
name = "widsetv2_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
winreg = "0.52"
